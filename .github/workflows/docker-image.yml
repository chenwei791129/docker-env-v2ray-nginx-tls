name: Build and push image

# Publishes ghcr.io/chenwei791129/env-v2ray-nginx-tls. The build itself lives in
# chenwei791129/.github so the pinned action versions are maintained in exactly
# one place across repositories. Pull requests only compile-check the image.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  # Weekly rebuild (before the Monday Trivy scan) so Alpine package fixes reach
  # the published image even when nothing was merged.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  build-and-push-image:
    permissions:
      contents: read
      packages: write
    uses: chenwei791129/.github/.github/workflows/build-and-push-image.yml@main
    with:
      # Short image name, matching the former Docker Hub repository
      # (awei/env-v2ray-nginx-tls) rather than the docker- prefixed repository name.
      image-name: chenwei791129/env-v2ray-nginx-tls
      platforms: linux/amd64,linux/arm64
      # A new value per run invalidates the cached apk layer (see Dockerfile).
      build-args: |
        APK_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
      enable-latest-tag: false
      additional-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
